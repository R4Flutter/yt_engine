# VIRALFORGE settings.
# Every key here is read by code — see the module named in each comment.
# Machine: Ryzen 5 5600H (6c/12t) · 7.3 GB RAM (~1 GB free) · AMD GPU, no CUDA.
# The RAM figure is the binding constraint: no local LLM, stream from SQLite.

paths:
  db:      db/viralforge.db      # the live corpus — do not repoint this
  raw:     data/raw
  thumbs:  data/thumbs
  models:  data/models
  reports: reports

api:                             # harvester/api_crawl.py
  key_env: YOUTUBE_API_KEY       # read from env, else .env
  max_videos_per_call: 50        # videos.list max — 1 unit per 50 videos
  daily_unit_budget: 9000        # of 10,000; leaves headroom

crawl:                           # harvester/api_crawl.py
  playlist_max_results: 200      # newest N per channel
  snapshot_window_days: 7        # track velocity only while a video is young
  snapshot_min_interval_h: 6

deep_crawl:                      # harvester/deep_crawl.py
  sub_lang: en
  sleep_requests: 3              # politeness — a soft ban costs days
  # cookies_from_browser: chrome # uncomment only if YouTube starts bot-checking

outliers:                        # miner/outliers.py, harvester/deep_crawl.py
  min_views: 10000
  min_channel_subs: 10000        # guard: a mis-resolved handle (48 subs, median 187)
                                 # manufactures huge scores and wastes crawl budget

align:                           # miner/alignment.py — the retention model
  sentence_gap_sec: 0.80         # empirical: p95 of word gaps on this corpus -> ~19 words/unit
  heat_lookahead_sec: 10         # window for heat_delta
  min_duration_sec: 120          # exclude Shorts from the long-form model
  min_sentences: 20
  min_videos_for_findings: 200   # below this, findings are reported as low-confidence

analyzer:                        # analyzer/score.py, analyzer/speech.py
  whisper_model: base.en         # CPU int8 — no CUDA on this AMD GPU
  device: cpu
  gate:
    payoff_promise_sec: 8        # hook must state the payoff by here
    min_wpm: 145
    cuts_per_min_min: 10
    cuts_per_min_max: 24
    max_static_shot_sec: 8
    loudness_lufs_min: -15
    loudness_lufs_max: -13       # YouTube normalizes to about -14 LUFS
  pass:
    overall_min: 80
    hook_min: 75
    retention_min: 70
    packaging_min: 75

llm:                             # miner/llm.py
  # Ollama is intentionally NOT the default: a 7B model needs ~5 GB resident
  # and this machine has ~1 GB free. It would swap-thrash the whole desktop.
  provider: claude
  claude:
    key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5-20251001
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:3b            # if you ever enable it, stay small
    timeout: 120

runtime:
  max_workers: 4                 # NOT 12 — RAM-bound, not CPU-bound
  abort_above_memory_pct: 85
  sqlite_chunk_size: 5000
