# VIRALFORGE settings.
# Every key here is read by code — see the module named in each comment.
# Machine: Ryzen 5 5600H (6c/12t) · 7.3 GB RAM (~1 GB free) · AMD GPU, no CUDA.
# The RAM figure is the binding constraint: no local LLM, stream from SQLite.

paths:
  db:      db/viralforge.db
  raw:     data/raw
  thumbs:  data/thumbs
  models:  data/models
  reports: reports

api:
  key_env: YOUTUBE_API_KEY
  max_videos_per_call: 50
  daily_unit_budget: 9000

crawl:
  playlist_max_results: 200
  snapshot_window_days: 7
  snapshot_min_interval_h: 6

deep_crawl:
  sub_lang: en
  sleep_requests: 3

outliers:
  min_views: 10000
  min_channel_subs: 10000

align:
  sentence_gap_sec: 0.80
  heat_lookahead_sec: 10
  min_duration_sec: 120
  min_sentences: 20
  min_videos_for_findings: 200

analyzer:
  whisper_model: base.en
  device: cpu
  gate:
    payoff_promise_sec: 8
    min_wpm: 145
    cuts_per_min_min: 10
    cuts_per_min_max: 24
    max_static_shot_sec: 8
    loudness_lufs_min: -15
    loudness_lufs_max: -13
  pass:
    overall_min: 80
    hook_min: 75
    retention_min: 70
    packaging_min: 75

llm:
  provider: claude
  claude:
    key_env: ANTHROPIC_API_KEY
    model: claude-haiku-4-5-20251001
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:3b
    timeout: 120

runtime:
  max_workers: 4
  abort_above_memory_pct: 85
  sqlite_chunk_size: 5000

hooks:
  window_sec: 30
  retrieval:
    semantic_weight: 0.30
    topic_weight: 0.20
    dna_weight: 0.15
    outlier_weight: 0.20
    retention_weight: 0.15
    top_k: 8
  generation:
    candidates: 60
    novelty_threshold: 0.72
    final_count: 12
    use_llm: false
  scoring:
    curiosity: 20
    specificity: 15
    stakes: 15
    novelty: 15
    clarity: 10
    open_loop: 15
    promise: 5
    pacing: 5
    learned: 10
    pattern_evidence: 10
  facts:
    strict: true

# Writing layer consumed by video_engine. Planning stays CPU/light; full prose
# generation uses the configured remote provider only when --llm is requested.
script_writer:
  default_profile: longform_business
  default_minutes: 20
  wpm: 165
  pause_factor: 1.12
  max_tokens: 12000
  min_minutes: 8
  max_minutes: 35
  require_visual_intent: true
  require_retention_devices: true
  require_fact_traceability: true
